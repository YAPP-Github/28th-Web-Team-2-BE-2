spring:
  config:
    import:
      - classpath:application-kamis-client.yml
  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  data:
    redis:
      host: localhost
      port: 6379
  flyway:
    enabled: false

springdoc:
  paths-to-exclude: /api/auth/test/**

news:
  crawler:
    enabled: false

management:
  health:
    redis:
      enabled: false

jwt:
  access-secret: test-only-access-secret-key-that-is-long-enough-for-hmac-sha
  refresh-secret: test-only-refresh-secret-key-that-is-long-enough-for-hmac-sha
  access-token-expiration: 30m
  refresh-token-expiration: 14d
  test-token-endpoint:
    enabled: false

kakao:
  map:
    url: https://dapi.kakao.com
    rest-api-key: test-kakao-rest-api-key
  oauth:
    client-id: test-kakao-client-id
    client-secret: test-kakao-client-secret
    test-redirect-uri: http://localhost:8080/api/auth/test/kakao/redirect
    test-endpoint:
      enabled: false
    issuer: https://kauth.kakao.com
    jwk-set-uri: https://kauth.kakao.com/.well-known/jwks.json

# 컨텍스트가 뜨는 데만 필요하다. 실제 S3 호출은 테스트에서 mock 으로 대체한다.
aws:
  region: ap-northeast-2
  s3:
    bucket: test-marketgo-images
    base-url: https://test-cdn.example.com/
# 컨텍스트가 뜨는 데만 필요한 값이다. 실제 호출은 테스트에서 mock 으로 대체한다.
# url 이 없으면 @FeignClient(url = "${qwen.vision.url}") 가 해석되지 않아 컨텍스트가 죽는다.
qwen:
  vision:
    url: https://dashscope-intl.example.com/compatible-mode/v1
    model: qwen-vl-plus
  api-key: test-qwen-api-key
