spring:
  application:
    name: demo
  config:
    import:
      - classpath:application-kamis-client.yml
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:app}
    username: ${POSTGRES_USER:app}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      # 도메인 상한(ImageSize 5MB)보다 약간 크게 둔다. 컨테이너가 먼저 끊으면
      # IMAGE_TOO_LARGE가 아니라 일반 에러가 나가 원인이 흐려진다.
      max-file-size: 6MB
      max-request-size: 6MB
  cloud:
    openfeign:
      client:
        config:
          # 이 레포에 feign timeout 설정이 없어 지금까지 기본값에 의존했다. 외부 호출이
          # 무한정 매달리지 않도록 기본값을 명시하고, 느린 vision 호출만 따로 늘린다.
          default:
            connect-timeout: 3000
            read-timeout: 5000
          qwenVisionClient:
            connect-timeout: 3000
            read-timeout: ${QWEN_READ_TIMEOUT_MS:20000}

springdoc:
  paths-to-exclude: /api/auth/test/**

news:
  crawler:
    enabled: true

item:
  price:
    collection:
      selenium:
        headless: false
        page-load-timeout: 30s
        wait-timeout: 10s
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

jwt:
  access-secret: ${JWT_ACCESS_SECRET}
  refresh-secret: ${JWT_REFRESH_SECRET}
  access-token-expiration: 30m
  refresh-token-expiration: 14d
  test-token-endpoint:
    enabled: ${JWT_TEST_TOKEN_ENDPOINT_ENABLED:false}
  refresh-cookie:
    secure: ${JWT_REFRESH_COOKIE_SECURE:true}

aws:
  region: ${AWS_REGION:ap-northeast-2}
  s3:
    bucket: ${AWS_S3_BUCKET:}
    # key를 그대로 이어 붙이는 접두사다. Terraform output image_base_url 값을 넣는다.
    base-url: ${AWS_S3_BASE_URL:}
    # 계약이 정한 10분. 늘리면 유출된 URL의 유효 기간도 함께 늘어난다.
    presign-expiry: ${AWS_S3_PRESIGN_EXPIRY:10m}
    # 로컬·테스트에서 S3 호환 저장소를 가리킬 때만 설정한다. 비어 있으면 실제 AWS를 쓴다.
    endpoint: ${AWS_S3_ENDPOINT:}

qwen:
  # DashScope OpenAI 호환 endpoint. 리전과 계정 형태에 따라 host가 갈리므로 설정으로 둔다.
  vision:
    url: ${QWEN_VISION_URL:https://dashscope-intl.aliyuncs.com/compatible-mode/v1}
    model: ${QWEN_VISION_MODEL:qwen-vl-plus}
  api-key: ${QWEN_API_KEY:}
  retry:
    # 사용자가 화면에서 기다리는 동기 호출이라 총 2회(최초 1회 + 재시도 1회)로 제한한다.
    max-attempts: ${QWEN_RETRY_MAX_ATTEMPTS:2}
    # Feign 자식 컨텍스트에는 Duration 변환기가 없어 밀리초로 둔다.
    period-ms: ${QWEN_RETRY_PERIOD_MS:500}
    max-period-ms: ${QWEN_RETRY_MAX_PERIOD_MS:2000}

kakao:
  map:
    url: ${KAKAO_MAP_URL:https://dapi.kakao.com}
    rest-api-key: ${KAKAO_MAP_API_KEY}
  oauth:
    client-id: ${KAKAO_CLIENT_ID:}
    client-secret: ${KAKAO_CLIENT_SECRET:}
    test-redirect-uri: ${KAKAO_TEST_REDIRECT_URI:http://localhost:8080/api/auth/test/kakao/redirect}
    test-endpoint:
      enabled: ${KAKAO_TEST_ENDPOINT_ENABLED:false}
    issuer: ${KAKAO_OAUTH_ISSUER:https://kauth.kakao.com}
    jwk-set-uri: ${KAKAO_OAUTH_JWK_SET_URI:https://kauth.kakao.com/.well-known/jwks.json}
