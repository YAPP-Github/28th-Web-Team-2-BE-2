spring:
  application:
    name: demo
  config:
    import:
      - classpath:application-kamis-client.yml
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:app}
    username: ${POSTGRES_USER:app}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
  cloud:
    openfeign:
      client:
        config:
          # 이 클라이언트에만 설정한다. default 를 건드리면 Kamis·Kakao 의 read timeout 이
          # Feign 기본값 60s 에서 함께 줄어드는데, 그 두 호출이 실제로 얼마나 걸리는지
          # 측정한 자료가 없어 이 PR 범위에서 바꿀 근거가 없다.
          qwenVisionClient:
            connect-timeout: ${QWEN_CONNECT_TIMEOUT_MS:3000}
            read-timeout: ${QWEN_READ_TIMEOUT_MS:20000}

springdoc:
  paths-to-exclude: /api/auth/test/**

news:
  crawler:
    enabled: true

item:
  price:
    collection:
      selenium:
        headless: false
        page-load-timeout: 30s
        wait-timeout: 10s
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

jwt:
  access-secret: ${JWT_ACCESS_SECRET}
  refresh-secret: ${JWT_REFRESH_SECRET}
  access-token-expiration: 30m
  refresh-token-expiration: 14d
  test-token-endpoint:
    enabled: ${JWT_TEST_TOKEN_ENDPOINT_ENABLED:false}
  refresh-cookie:
    secure: ${JWT_REFRESH_COOKIE_SECURE:true}

qwen:
  # connect/read timeout 은 Feign 규약상 spring.cloud.openfeign.client.config.qwenVisionClient 에 있다.
  # DashScope OpenAI 호환 endpoint. 리전과 계정 형태에 따라 host가 갈리므로 설정으로 둔다.
  vision:
    url: ${QWEN_VISION_URL:https://dashscope-intl.aliyuncs.com/compatible-mode/v1}
    model: ${QWEN_VISION_MODEL:qwen-vl-plus}
  # 기본값을 두지 않는다. 누락되면 placeholder 오류에 env 이름이 찍혀 진단이 쉽다(kakao 와 같은 방식).
  api-key: ${QWEN_API_KEY}
  retry:
    # 사용자가 화면에서 기다리는 동기 호출이라 총 2회로 제한한다.
    max-attempts: ${QWEN_RETRY_MAX_ATTEMPTS:2}
    period: ${QWEN_RETRY_PERIOD:500ms}
    max-period: ${QWEN_RETRY_MAX_PERIOD:2s}

kakao:
  map:
    url: ${KAKAO_MAP_URL:https://dapi.kakao.com}
    rest-api-key: ${KAKAO_MAP_API_KEY}
  oauth:
    client-id: ${KAKAO_CLIENT_ID:}
    client-secret: ${KAKAO_CLIENT_SECRET:}
    test-redirect-uri: ${KAKAO_TEST_REDIRECT_URI:http://localhost:8080/api/auth/test/kakao/redirect}
    test-endpoint:
      enabled: ${KAKAO_TEST_ENDPOINT_ENABLED:false}
    issuer: ${KAKAO_OAUTH_ISSUER:https://kauth.kakao.com}
    jwk-set-uri: ${KAKAO_OAUTH_JWK_SET_URI:https://kauth.kakao.com/.well-known/jwks.json}
