name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  gradle-check:
    name: Gradle check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Grant Gradle wrapper execute permission
        run: chmod +x gradlew

      - name: Run Gradle check and package application
        run: ./gradlew clean check :api:bootJar --no-daemon

      - name: Prepare application JAR
        shell: bash
        run: |
          set -euo pipefail
          jar_path="$(find api/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-plain.jar' -print -quit)"
          test -n "$jar_path"
          if [[ "$jar_path" != "api/build/libs/app.jar" ]]; then
            cp "$jar_path" api/build/libs/app.jar
          fi

      - name: Upload application JAR
        uses: actions/upload-artifact@v4
        with:
          name: demo-jar
          path: api/build/libs/app.jar
          if-no-files-found: error
          retention-days: 1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ARM64 Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: false
          tags: demo:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish JaCoCo report to PR
        if: ${{ always() && github.event_name == 'pull_request' }}
        continue-on-error: true
        uses: madrapps/jacoco-report@50d3aff4548aa991e6753342d9ba291084e63848 # v1.7.2
        with:
          title: "📊 테스트 커버리지"
          paths: ${{ github.workspace }}/api/build/reports/jacoco/test/jacocoTestReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 90
          update-comment: true

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: |
            api/build/reports/jacoco/test/html/
            api/build/reports/jacoco/test/jacocoTestReport.xml
          if-no-files-found: warn
          retention-days: 14
